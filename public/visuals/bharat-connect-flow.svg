<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="840" viewBox="0 0 680 420" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th{font-size:14px;font-weight:600;text-anchor:middle;dominant-baseline:central}
.ts{font-size:12px;text-anchor:middle;dominant-baseline:central}
</style>
</defs>
<rect width="680" height="420" fill="#FFFFFF"/>
<text x="340" y="26" style="font-size:19px;font-weight:600;text-anchor:middle;dominant-baseline:central" fill="#2C2C2A">Bharat Connect: how a bill payment flows</text>

<g transform="translate(0,44)">
<rect x="40" y="30" width="176" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text class="th" x="128" y="48" fill="#712B13">QR or payment link</text>
<text class="ts" x="128" y="68" fill="#993C1D">Biller-generated</text>

<rect x="40" y="126" width="104" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="th" x="92" y="144" fill="#444441">Customer</text>
<text class="ts" x="92" y="164" fill="#5F5E5A">Pays the bill</text>

<rect x="164" y="126" width="104" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="th" x="216" y="144" fill="#085041">COU</text>
<text class="ts" x="216" y="164" fill="#0F6E56">Customer side</text>

<rect x="288" y="126" width="104" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
<text class="th" x="340" y="144" fill="#3C3489">BBPCU</text>
<text class="ts" x="340" y="164" fill="#534AB7">NPCI central unit</text>

<rect x="412" y="126" width="104" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
<text class="th" x="464" y="144" fill="#085041">BOU</text>
<text class="ts" x="464" y="164" fill="#0F6E56">Biller side</text>

<rect x="536" y="126" width="104" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/>
<text class="th" x="588" y="144" fill="#444441">Biller</text>
<text class="ts" x="588" y="164" fill="#5F5E5A">Utility, telecom</text>

<g fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round">
<line x1="92" y1="124" x2="92" y2="90" marker-end="url(#a)"/>
<path d="M218 58 L240 58 L240 100 L216 100 L216 124" marker-end="url(#a)"/>
<line x1="146" y1="154" x2="162" y2="154" marker-end="url(#a)"/>
<line x1="270" y1="154" x2="286" y2="154" marker-end="url(#a)"/>
<line x1="394" y1="154" x2="410" y2="154" marker-end="url(#a)"/>
<line x1="518" y1="154" x2="534" y2="154" marker-end="url(#a)"/>
</g>

<g stroke="#888780" stroke-width="0.8" stroke-dasharray="3 3">
<line x1="216" y1="182" x2="216" y2="216"/>
<line x1="464" y1="182" x2="464" y2="216"/>
</g>
<rect x="164" y="216" width="352" height="50" rx="8" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 4"/>
<text class="th" x="340" y="234" fill="#2C2C2A">Funds move over payment rails</text>
<text class="ts" x="340" y="252" fill="#5F5E5A">UPI, cards, net banking, IMPS</text>

<rect x="40" y="296" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<text class="th" x="340" y="314" fill="#2C2C2A">Message sequence</text>
<text class="ts" x="340" y="334" fill="#5F5E5A">Fetch → payment → pending check (402) → net settlement by BBPCU</text>
</g>
</svg>
